# SOCIALISTIC self-host / dev stack.
# app + worker + scheduler share one image; mysql + redis back them.
services:
  # Edge proxy: terminates TLS for the platform domain + tenant custom domains
  # (on-demand Let's Encrypt certs gated by the app's /tls/check endpoint).
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  app:
    build: .
    restart: unless-stopped
    expose:
      - "8000"
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: socialistic
      DB_USERNAME: socialistic
      DB_PASSWORD: secret
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  # Queue workers run the publishing engine (PublishPostJob, token refresh, analytics).
  worker:
    build: .
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --backoff=10 --max-time=3600
    env_file: .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    depends_on:
      - app

  # Dispatches due scheduled posts every minute via Laravel's scheduler.
  scheduler:
    build: .
    restart: unless-stopped
    command: php artisan schedule:work
    env_file: .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    depends_on:
      - app

  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: socialistic
      MYSQL_USER: socialistic
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  mysql-data:
  redis-data:
  caddy-data:
  caddy-config:
